name: Test downstream patches

on:
  push:
    branches:
      - SingleUser
    paths:
      - "patches/xray/**"
      - "patches/quic-go/**"
      - "patches/apply-dependency-patches.sh"
      - ".github/workflows/sync-upstream.yml"
      - ".github/workflows/test-patches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SingleUser
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Apply patch series to clean upstream main and test
        run: |
          set -euo pipefail
          patch_root="${PWD}/patches/xray"
          worktree="${RUNNER_TEMP}/xray-patched"
          git fetch --no-tags origin main
          git worktree add --detach "${worktree}" origin/main
          trap 'git worktree remove --force "${worktree}"' EXIT
          for patch in "${patch_root}"/*.patch; do
            git -C "${worktree}" apply --check --whitespace=error-all "${patch}"
            git -C "${worktree}" apply --whitespace=error-all "${patch}"
          done
          git -C "${worktree}" diff --check
          cd "${worktree}"
          dependency_flags="$("${GITHUB_WORKSPACE}/patches/apply-dependency-patches.sh" "${worktree}")"
          export "${dependency_flags}"
          quic_dir="$(go list -m -f '{{.Dir}}' github.com/apernet/quic-go)"
          (
            cd "${quic_dir}"
            GOFLAGS= go test ./internal/ackhandler
          )
          cd "${worktree}"
          go test \
            ./common/buf \
            ./proxy \
            ./proxy/freedom \
            ./proxy/vless/inbound \
            ./transport/internet/hysteria/congestion/bbr \
            ./transport/internet/splithttp
