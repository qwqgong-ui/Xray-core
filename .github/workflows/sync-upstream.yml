name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'qwqgong-ui/Xray-core'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror upstream into main
        env:
          TARGET_BRANCH: main
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/XTLS/Xray-core.git 2>/dev/null ||
            git remote set-url upstream https://github.com/XTLS/Xray-core.git
          git fetch --no-tags origin "${TARGET_BRANCH}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          current_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          if [[ "${current_sha}" == "${upstream_sha}" ]]; then
            echo "${TARGET_BRANCH} already matches upstream/${UPSTREAM_BRANCH}"
            exit 0
          fi

          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${current_sha}" \
            origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${TARGET_BRANCH}"
